[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "freesurfer-torch"
version = "0.2.0"
description = "Standalone PyTorch SynthStrip and SynthMorph inference with GPU batch workers"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "torch>=2.1",
  "numpy>=1.23,<2",
  "scipy>=1.9",
  "surfa==0.6.3",
  "h5py>=3.8",
]

[project.scripts]
fs-torch = "freesurfer_torch.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools]
license-files = ["licenses/*.txt", "THIRD_PARTY_NOTICES.md"]

[tool.setuptools.package-data]
freesurfer_torch = ["synthstrip/*.md", "synthmorph/*.md"]
