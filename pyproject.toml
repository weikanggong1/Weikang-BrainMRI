[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "freesurfer-torch"
version = "0.9.0"
description = "Standalone PyTorch brain MRI inference with Python multi-subject APIs"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "torch>=2.1",
  "numpy>=1.23,<2",
  "scipy>=1.9",
  "surfa==0.6.3",
  "nibabel>=5",
  "h5py>=3.8",
  "pandas>=1.5",
  "PyYAML>=6",
]

[project.scripts]
fs-torch = "freesurfer_torch.cli:main"
fs-torch-setup-weights = "freesurfer_torch.weights:main"
fs-torch-recon-all = "freesurfer_torch.recon_all.standalone:main"
fs-torch-applywarp = "freesurfer_torch.applywarp.cli:main"
fs-torch-flirt = "freesurfer_torch.flirt.cli:main"
fs-torch-fnirt = "freesurfer_torch.fnirt.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools]
license-files = ["licenses/*.txt", "THIRD_PARTY_NOTICES.md"]

[tool.setuptools.package-data]
freesurfer_torch = [
  "_vendor_fsl/*.md",
  "_vendor_fsl/*.json",
  "_vendor_fsl/sources/**/*",
  "_vendor_fsl/sources/**/.*",
  "applywarp/*.md",
  "flirt/*.md",
  "fnirt/*.md",
  "synthstrip/*.md",
  "synthmorph/*.md",
  "wmh_synthseg/*.md",
  "synthsr/*.md",
  "fast/*.md",
  "fast/upstream_fast4/*",
  "fast_vbm/*.md",
]
